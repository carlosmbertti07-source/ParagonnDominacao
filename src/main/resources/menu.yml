# ==========================================================================
#  ParagonnDominacao - menu.yml
#  Menu aberto ao clicar no NPC de top (/dominacao npc top).
#  Lido em UTF-8. Recarregue com /dominacao reload.
#
#  title ....... título (máx. 32 caracteres na 1.8). %arena% = nome da arena
#  rows ........ linhas do baú (1 a 6)
#  entries ..... quantas posições aparecem na descrição de cada cabeça
#  items.<id>:
#    slot ...... posição no baú (0 = canto superior esquerdo)
#    type ...... CLAN_POINTS, CLAN_DOMINATIONS, CLAN_KILLS ou PLAYER_KILLS
#    texture ... valor base64 da cabeça (ex.: minecraft-heads.com, campo "Value")
#    name / header / line / empty-line / footer
#                line: %position% %name% %value%
#                footer: %my_position% %my_value% (posição do seu clan ou sua)
#  close ....... botão que fecha o menu
# ==========================================================================

