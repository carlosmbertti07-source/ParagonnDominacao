  top:
    lines:
    - "&6&lTOP DOMINAÇÃO"
    - "&f%arena_upper%"
  # Holograma avulso de top de clans (/dominacao holograma set)
  # line: %position% %clan% %points% %dominations%
  board:
    header:
    - "&6&lTOP CLANS"
    - "&fOs clans que mais dominam esta Mina"
    - ""
    line: "&6%position%º  &f[%clan%&f]  &e%points% &fpontos"
    empty-line: "&6%position%º  &f[---]  &e0 &fpontos"
    footer: []
  champion:
    lines:
    - "&6&lCAMPEÃO DA MINA"
    - "&fClan dominante: &e%clan%"
    - "&fJogador: &e%player%"
    - "&fAbates: &e%kills%"
    no-kills:
    - "&6&lCAMPEÃO DA MINA"
    - "&fClan dominante: &e%clan%"
    - "&fNenhum abate registrado ainda"
    none:
    - "&6&lCAMPEÃO DA MINA"
    - "&fNenhum clan domina a &e%arena%"

